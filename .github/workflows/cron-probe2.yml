name: cron-probe-range

on:
  schedule:
    - cron: '25-55/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 记录触发时间
        run: |
          echo "range-step 语法触发成功"
          date -u '+UTC %Y-%m-%d %H:%M:%S'
