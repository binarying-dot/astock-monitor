name: A股下跌家数监控

# 说明：
# GitHub 免费账号的 cron 触发极不规律（实测每 1-2 小时才真正触发一次），
# 因此策略是「提高触发机会 + 单次触发后自行循环覆盖整个交易时段」。
# 脚本内部有严格的时段闸门：非交易时段毫秒级退出，不会浪费资源。
on:
  schedule:
    - cron: '*/5 * * * *'         # 全天每 5 分钟给一次触发机会（脚本自行判断时段）
  workflow_dispatch:              # 手动触发
    inputs:
      force:
        description: '跳过时段闸门与循环（测试用，只跑一次）'
        type: boolean
        default: false

permissions:
  contents: write                 # 允许回写 state.json（同时保活仓库）

concurrency:
  group: astock-monitor
  cancel-in-progress: false       # 保证同一时间只有一个会话在跑，避免重复推送

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355          # 单 job 上限 6h；本任务最长循环 5h45m
    steps:
      - uses: actions/checkout@v4

      - name: 运行监控（触发后循环覆盖至收盘）
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK || vars.WECOM_WEBHOOK }}
          THRESHOLD: ${{ vars.THRESHOLD || '5000' }}
          FORCE: ${{ inputs.force }}
        run: python3 monitor_actions.py

      - name: 提交状态文件
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ ! -f state.json ]; then
            echo "无状态文件，跳过提交"
            exit 0
          fi
          git add -f state.json
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: 更新监控状态 [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
